<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 220" width="1600" height="220" role="img" aria-label="">
  <!-- The hero's arcs, continued. Same source geometry, sliced flat, so the
       motif reads as one voice carrying through the page rather than a
       decoration repeated per section. -->
  <defs>
    <linearGradient id="dfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B45309" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#B45309" stop-opacity="0.34"/>
      <stop offset="0.62" stop-color="#B45309" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#B45309" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#dfade)" stroke-linecap="round">
    <circle cx="-260" cy="1180" r="1010" stroke-width="2.4"/>
    <circle cx="-260" cy="1180" r="1120" stroke-width="2.1"/>
    <circle cx="-260" cy="1180" r="1240" stroke-width="1.9"/>
    <circle cx="-260" cy="1180" r="1370" stroke-width="1.7"/>
    <circle cx="-260" cy="1180" r="1510" stroke-width="1.5"/>
    <circle cx="-260" cy="1180" r="1660" stroke-width="1.3"/>
  </g>
</svg>
